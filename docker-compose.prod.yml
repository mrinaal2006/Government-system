# Production override (single host). Requires:
#   - real secrets in .env (production refuses weak or placeholder values)
#   - TLS certificate and key in ./secrets/tls/ (tls.crt, tls.key)
#   - the "scan" profile so ClamAV runs:
#
#   docker compose --profile scan -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# See docs/deployment.md.

x-prod-env: &prod-env
  APP_ENV: production
  SESSION_COOKIE_SECURE: "true"
  EXPOSE_API_DOCS: "false"
  MALWARE_SCANNER: clamav
  LOG_FORMAT: json

services:
  api:
    environment: *prod-env
    depends_on:
      clamav:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1g }

  worker:
    environment: *prod-env
    depends_on:
      clamav:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1g }

  beat:
    environment: *prod-env

  migrate:
    environment: *prod-env

  db:
    deploy:
      resources:
        limits: { memory: 2g }

  web:
    ports: !override
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:80:8080"
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:443:8443"
    volumes:
      - ./infra/nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./secrets/tls:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate https://127.0.0.1:8443/ || exit 1"]
