# Security headers for UI responses. API responses carry their own headers
# (set by the FastAPI middleware), so this file is included only in UI locations.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# No inline scripts or styles, no third-party origins: all assets are self-hosted.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# HSTS and upgrade-insecure-requests are enabled in Phase 10 together with TLS:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
