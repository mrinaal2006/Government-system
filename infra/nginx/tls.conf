# DG-IMEWS web tier, production (TLS). Mounted over default.conf by docker-compose.prod.yml.
# Certificates: /etc/nginx/certs/tls.crt and tls.key (from the department's CA or NIC).

log_format json_combined escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"duration_s":$request_time,"upstream_s":"$upstream_response_time","user_agent":"$http_user_agent"}';

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_status 429;

upstream dgimews_api {
  server api:8000;
  keepalive 16;
}

# Plain HTTP only redirects to HTTPS.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  access_log /dev/stdout json_combined;
  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 8443 ssl;
  http2 on;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  access_log /dev/stdout json_combined;
  error_log /dev/stderr warn;

  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1h;
  ssl_session_tickets off;

  client_max_body_size 51m;
  client_body_timeout 30s;
  client_header_timeout 15s;

  location = /api/v1/system/metrics {
    return 404;
  }

  location /api/ {
    limit_req zone=api_per_ip burst=40 nodelay;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    proxy_pass http://dgimews_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }

  location ~ /\. {
    deny all;
    return 404;
  }
}
