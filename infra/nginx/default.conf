# DG-IMEWS web tier: serves the built React application and proxies /api to the
# FastAPI service on the internal network. TLS termination is added in Phase 10.

log_format json_combined escape=json
  '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"duration_s":$request_time,"upstream_s":"$upstream_response_time","user_agent":"$http_user_agent"}';

# Baseline per-client request limit for the API; per-endpoint limits for
# authentication are enforced by the application in Phase 2.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_status 429;

upstream dgimews_api {
  server api:8000;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  # $uri (not $request_uri) is logged so query strings with search terms are not stored.
  access_log /dev/stdout json_combined;
  error_log /dev/stderr warn;

  client_max_body_size 51m;
  client_body_timeout 30s;
  client_header_timeout 15s;

  # Metrics are for the internal monitoring network only.
  location = /api/v1/system/metrics {
    return 404;
  }

  location /api/ {
    limit_req zone=api_per_ip burst=40 nodelay;
    proxy_pass http://dgimews_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }

  # Hashed, immutable build assets.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Single-page application: unknown paths fall back to index.html (client routing).
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }

  # Never serve dotfiles.
  location ~ /\. {
    deny all;
    return 404;
  }
}
