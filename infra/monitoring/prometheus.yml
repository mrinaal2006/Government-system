# Prometheus scrape configuration (run with: docker compose --profile monitoring ...).
# The bearer token file must contain METRICS_TOKEN; mount it read-only.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: dgimews-api
    metrics_path: /api/v1/system/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["api:8000"]
