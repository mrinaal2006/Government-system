[project]
name = "dgimews-backend"
version = "0.1.0"
description = "District Grievance Intelligence, Monitoring & Early Warning System - backend (modular monolith)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "gunicorn==26.2.0",
    "sqlalchemy==2.0.55",
    "psycopg[binary,pool]==3.3.6",
    "alembic==1.20.1",
    "geoalchemy2==0.20.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "redis==6.4.0",
    "celery[redis]==5.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.17.3",
    "mypy==2.4.1",
    "shapely==2.2.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires running PostgreSQL/PostGIS and Redis (see docs/development.md)",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "A", "C4", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
"alembic/versions/**" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["app.worker.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["celery.*", "geoalchemy2.*", "kombu.*"]
ignore_missing_imports = true
